<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BYU Hangman</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background-color: #f9f9f4;
      font-family: Arial, sans-serif;
      color: #000;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 100px; /* prevent content being hidden behind footer */
    }

    header {
      width: 100%;
      background-color: #002E5D;
      padding: 20px 0;
      text-align: center;
    }

    header h1 {
      color: white;
      margin: 0;
      font-size: 36px;
      font-weight: bold;
    }

    #hangmanCanvas {
      border: 2px solid #333;
      background-color: #fff;
      margin: 30px 0 20px 0;
      width: 300px;
      height: 350px;
    }

    .word-display {
      font-size: 36px;
      letter-spacing: 12px;
      margin-bottom: 20px;
    }

    .alphabet {
      display: flex;
      flex-wrap: wrap;
      max-width: 600px;
      justify-content: center;
      gap: 12px;
    }

    .letter {
      padding: 14px 18px;
      background-color: #eee;
      border: 1px solid #aaa;
      cursor: pointer;
      font-size: 24px;
      user-select: none;
    }

    .letter.guessed {
      background-color: #ccc;
      text-decoration: line-through;
      cursor: default;
    }

    #message {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    #restartBtn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 18px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: none;
    }

    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: #002E5D;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }

    .footer img {
      height: 40px;
    }

    #difficultySelect {
      margin-top: 15px;
      font-size: 18px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>BYU Hangman</h1>
    <a style="color: white;" href="index.html">Resume Page</a><br><br>
    <a style="color: white;" href="scratch.html">My Hobbies</a>
  </header>

  <select id="difficultySelect">
    <option value="easy">Easy (10 guesses)</option>
    <option value="medium" selected>Medium (6 guesses)</option>
    <option value="hard">Hard (4 guesses)</option>
  </select>

  <canvas id="hangmanCanvas" width="300" height="350"></canvas>

  <div class="word-display" id="wordDisplay">_ _ _ _</div>

  <div class="alphabet" id="alphabet"></div>

  <div id="message"></div>
  <button id="restartBtn" onclick="startGame()">Play Again</button>

  <div class="footer">
    <img src="assets/img/brigham.jpg" alt="BYU Logo">
  </div>

  <script>
    const byuWords = [
      'cougars', 'provo', 'brigham', 'wilkinson', 'cosmo', 'honor',
      'devotional', 'marriott', 'smithfield', 'lavell', 'conference',
      'cougarstats', 'nauvoo', 'deseret', 'yfacts', 'relief', 'semester',
      'cannon', 'maxhall', 'rivalry'
    ];

    const canvas = document.getElementById('hangmanCanvas');
    const ctx = canvas.getContext('2d');
    const wordDisplay = document.getElementById('wordDisplay');
    const alphabetDiv = document.getElementById('alphabet');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restartBtn');
    const difficultySelect = document.getElementById('difficultySelect');

    let secretWord = '';
    let guessedLetters = [];
    let wrongGuesses = 0;
    let maxWrong = 6;

    function drawGallows() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#000';

      ctx.beginPath(); ctx.moveTo(10, 340); ctx.lineTo(290, 340); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(70, 340); ctx.lineTo(70, 20); ctx.lineTo(220, 20); ctx.lineTo(220, 50); ctx.stroke();
    }

    function drawHangman(stage) {
      ctx.strokeStyle = '#000';
      switch(stage) {
        case 1: ctx.beginPath(); ctx.arc(220, 80, 25, 0, Math.PI * 2); ctx.stroke(); break;
        case 2: ctx.beginPath(); ctx.moveTo(220, 105); ctx.lineTo(220, 200); ctx.stroke(); break;
        case 3: ctx.beginPath(); ctx.moveTo(220, 200); ctx.lineTo(190, 250); ctx.stroke(); break;
        case 4: ctx.beginPath(); ctx.moveTo(220, 200); ctx.lineTo(250, 250); ctx.stroke(); break;
        case 5: ctx.beginPath(); ctx.moveTo(220, 130); ctx.lineTo(190, 160); ctx.stroke(); break;
        case 6: ctx.beginPath(); ctx.moveTo(220, 130); ctx.lineTo(250, 160); ctx.stroke(); break;
      }
    }

    function updateWordDisplay() {
      const display = secretWord.split('').map(letter =>
        guessedLetters.includes(letter) ? letter.toUpperCase() : '_'
      ).join(' ');
      wordDisplay.textContent = display;
    }

    function createAlphabet() {
      alphabetDiv.innerHTML = '';
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      for (let char of letters) {
        const span = document.createElement('span');
        span.textContent = char;
        span.classList.add('letter');
        span.addEventListener('click', () => handleGuess(char.toLowerCase(), span));
        alphabetDiv.appendChild(span);
      }
    }

    function handleGuess(letter, element) {
      if (guessedLetters.includes(letter)) return;
      guessedLetters.push(letter);
      element.classList.add('guessed');
      element.removeEventListener('click', handleGuess);

      if (secretWord.includes(letter)) {
        updateWordDisplay();
        checkWin();
      } else {
        wrongGuesses++;
        drawHangman(wrongGuesses);
        if (wrongGuesses >= maxWrong) {
          endGame(false);
        }
      }
    }

    function checkWin() {
      const won = secretWord.split('').every(l => guessedLetters.includes(l));
      if (won) endGame(true);
    }

    function endGame(won) {
      if (won) {
        messageEl.textContent = `🎉 You guessed it! The word was "${secretWord.toUpperCase()}"`;
        confetti(); // trigger confetti when won
      } else {
        messageEl.textContent = `😢 Game Over. The word was "${secretWord.toUpperCase()}"`;
      }
      restartBtn.style.display = 'inline-block';
      document.querySelectorAll('.letter').forEach(l => l.classList.add('guessed'));
    }

    function setDifficulty() {
      const difficulty = difficultySelect.value;
      switch(difficulty) {
        case 'easy': maxWrong = 10; break;
        case 'medium': maxWrong = 6; break;
        case 'hard': maxWrong = 4; break;
      }
    }

    function startGame() {
      setDifficulty();
      const difficulty = difficultySelect.value;
      let filteredWords = [...byuWords];
      if (difficulty === 'hard') {
        filteredWords = filteredWords.filter(word => word.length >= 8);
      } else if (difficulty === 'easy') {
        filteredWords = filteredWords.filter(word => word.length <= 7);
      }
      secretWord = filteredWords[Math.floor(Math.random() * filteredWords.length)];
      guessedLetters = [];
      wrongGuesses = 0;
      messageEl.textContent = '';
      restartBtn.style.display = 'none';
      createAlphabet();
      updateWordDisplay();
      drawGallows();
    }

    difficultySelect.addEventListener('change', startGame);
    startGame();
  </script>
</body>
</html>
